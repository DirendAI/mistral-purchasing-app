[project]
name = "agent-app"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "httpx>=0.28.1",
    "mistralai>=2.9.4",
    "mistralai-agents==1.1.0rc10",
]

[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agent"

[tool.mistralai.agents]
entrypoint = "agent.main:agent"
