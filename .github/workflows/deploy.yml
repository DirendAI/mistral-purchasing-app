name: Deploy to Studio

on:
  push:
    branches:
      - master

concurrency:
  group: studio-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@v4

      - name: Install the Mistral CLI and the bun runtime mistral apps needs
        run: |
          curl -fsSL https://mistral.ai/cli/install.sh | MISTRAL_VERSION=0.17.1 MISTRAL_INSTALL_BUN=1 bash
          echo "$HOME/.mistral/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Sign in headless with the API key and show the resolved identity
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          printf '%s\n' "$MISTRAL_API_KEY" | mistral login --api-key -
          mistral whoami

      - name: Install uv (deploying the agent module needs it on PATH)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Enable the mistral_cli_agents feature flag for this run
        run: |
          cfg="$HOME/.config/mistral/config.json"
          mkdir -p "$(dirname "$cfg")"
          [ -f "$cfg" ] || echo '{}' > "$cfg"
          jq '.flags = ((.flags // {}) + {mistral_cli_agents: true})' "$cfg" > "$cfg.tmp" && mv "$cfg.tmp" "$cfg"
          cat "$cfg"

      - name: Deploy the pushed commit to the bound Studio app
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          git fetch origin
          mistral apps deploy --yes
