name: Deploy to Studio

on:
  push:
    branches:
      - master

concurrency:
  group: studio-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the pushed commit
        uses: actions/checkout@v4

      - name: Install the Mistral CLI and the bun runtime mistral apps needs
        run: |
          curl -fsSL https://mistral.ai/cli/install.sh | MISTRAL_INSTALL_BUN=1 bash
          echo "$HOME/.mistral/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Verify the deploy command is registered
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: mistral apps deploy --help

      - name: Deploy with the workspace API key
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          git fetch origin
          mistral apps deploy
